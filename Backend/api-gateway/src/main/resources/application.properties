
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=api-gateway
server.port=8080

# ==========================================
# EUREKA CLIENT CONFIGURATION
# ==========================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# GATEWAY CONFIGURATION
# ==========================================
spring.cloud.gateway.discovery.locator.enabled=false

# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=railwaylocaldevsecretkey123456789012
jwt.issuer=railway-reservation-system

# ==========================================
# REGISTRATION SERVICE ROUTE
# ==========================================
spring.cloud.gateway.server.webflux.routes[0].id=registration-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://registration-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/registration/**

# ==========================================
# LOGIN SERVICE ROUTE
# ==========================================
spring.cloud.gateway.server.webflux.routes[1].id=login-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://login-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/auth/**

# ==========================================
# TRAIN SERVICE ROUTE
# ==========================================
spring.cloud.gateway.server.webflux.routes[2].id=train-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://train-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/trains/**

# ==========================================
# RESERVATION SERVICE ROUTE
# ==========================================
spring.cloud.gateway.server.webflux.routes[3].id=reservation-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://reservation-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/reservations/**

# ==========================================
# PAYMENT SERVICE ROUTE
# ==========================================
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.com.netflix.discovery=INFO

# ==========================================
# LOG FILE
# ==========================================
logging.file.name=logs/api-gateway.log
