
# Application Configuration
spring.application.name=login-service
server.port=8082

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Internal Service Communication
internal.auth.api-key=secretkey

# JWT Configuration
jwt.secret=railwaylocaldevsecretkey123456789012
jwt.expiration=3600000
jwt.issuer=railway-reservation-system

# Logging
logging.level.com.railway.login=INFO
logging.file.name=logs/login-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Log Rotation
logging.logback.rollingpolicy.file-name-pattern=logs/login-service-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
