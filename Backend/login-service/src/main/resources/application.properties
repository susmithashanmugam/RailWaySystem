# Test Configuration
spring.application.name=login-service-test

# Disable Eureka during unit tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# Test JWT configuration
jwt.secret=testsecretkey123456789012345678901234
jwt.expiration=3600000
jwt.issuer=railway-reservation-system

# Test internal authentication
internal.auth.api-key=test-secret-key

# Logging
logging.level.root=WARN