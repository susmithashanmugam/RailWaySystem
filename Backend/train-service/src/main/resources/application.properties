
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=train-service

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8083

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/railway_train_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Susmitha}

# ==========================================
# JPA CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# EUREKA CLIENT CONFIGURATION
# ==========================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.com.railway.trainservice=INFO
logging.level.org.springframework.security=TRACE
logging.file.name=logs/train-service.log

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=railwaylocaldevsecretkey123456789012
jwt.issuer=railway-reservation-system


logging.file.name=logs/train-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/train-service-%d{yyyy-MM-dd}.%i.log.gz

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB